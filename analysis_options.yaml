analyzer:
  # The Analysis Server plugin intentionally owns an isolated analyzer graph.
  # It is analyzed and tested from its own Package to avoid version collisions.
  exclude:
    - packages/ccrouter_analyzer_plugin/**
  errors:
    unused_import: error
    unused_local_variable: error
    invalid_use_of_internal_member: error

linter:
  rules:
    depend_on_referenced_packages: true
    implementation_imports: true
    public_member_api_docs: true
