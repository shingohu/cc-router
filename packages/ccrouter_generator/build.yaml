builders:
  ui_fragments:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccUIFragmentBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/ui/{{}}.ui.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  ui_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccUIFragmentMetadataBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/metadata/{{}}.ui.json"]
    auto_apply: dependents
    build_to: cache
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  init_tasks:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccInitTaskBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/init_task/{{}}.init_task.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  init_task_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccInitTaskMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart": ["lib/src/ccrouter_generated/metadata/{{}}.init_task.json"]
    auto_apply: dependents
    build_to: cache
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  events:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccEventBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/event/{{}}.event.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  event_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccEventMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart": ["lib/src/ccrouter_generated/metadata/{{}}.event.json"]
    auto_apply: dependents
    build_to: cache
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  commands:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccCommandBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/command/{{}}.command.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  command_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccCommandMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart": ["lib/src/ccrouter_generated/metadata/{{}}.command.json"]
    auto_apply: dependents
    build_to: cache
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  service_contracts:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccServiceContractBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/contract/{{}}.service.contract.g.dart"]
    auto_apply: dependents
    build_to: source
    runs_before: ["ccrouter_generator:services", "ccrouter_generator:service_metadata"]
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  services:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccServiceBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/service/{{}}.service.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  service_proxies:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccServiceProxyBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/component/{{}}.service_api.g.dart"]
    auto_apply: dependents
    build_to: source
    runs_before: ["ccrouter_generator:component_metadata"]
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  service_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccServiceMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart": ["lib/src/ccrouter_generated/metadata/{{}}.service.json"]
    auto_apply: dependents
    build_to: cache
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  route_contracts:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccRouteContractBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/contract/{{}}.route.contract.g.dart"]
    auto_apply: dependents
    build_to: source
    runs_before: ["ccrouter_generator:routes", "ccrouter_generator:route_metadata"]
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  routes:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccRouteBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/route/{{}}.route.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  route_bindings:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccRouteBindingBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/binding/{{}}.route_binding.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  component_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccComponentMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart": ["lib/src/ccrouter_generated/metadata/{{}}.component.json"]
    auto_apply: dependents
    build_to: cache
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  route_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccRouteMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart": ["lib/src/ccrouter_generated/metadata/{{}}.route.json"]
    auto_apply: dependents
    build_to: cache
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
