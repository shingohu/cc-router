builders:
  route_contracts:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccRouteContractBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/{{}}.route.contract.g.dart"]
    auto_apply: dependents
    build_to: source
    runs_before: ["ccrouter_generator:routes", "ccrouter_generator:route_metadata"]
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  routes:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccRouteBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/{{}}.route.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  components:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccComponentBuilder"]
    build_extensions:
      "^lib/src/{{}}.dart": ["lib/src/ccrouter_generated/{{}}.component.g.dart"]
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  component_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccComponentMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart":
        - "ccrouter_generated/{{}}.component.json"
        - "ccrouter_generated/{{}}.component.md"
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
  route_metadata:
    import: "package:ccrouter_generator/builder.dart"
    builder_factories: ["ccRouteMetadataBuilder"]
    build_extensions:
      "^lib/{{}}.dart":
        - "ccrouter_generated/{{}}.route.json"
        - "ccrouter_generated/{{}}.route.md"
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ["lib/**/ccrouter_generated/**"]
